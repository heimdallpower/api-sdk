name: Publish NuGet Package

on:
  release:
    types: [published]

jobs:
  guard:
    name: Check tag belongs to .NET
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.guard.outputs.publish }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate tag format
        id: guard
        run: bash .github/scripts/tag-guard.sh dotnet "$GITHUB_REF_NAME"

  publish:
    name: Publish to NuGet
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Allow actions/checkout to fetch the repository
      id-token: write # Enable GitHub OIDC token issuance for NuGet Trusted Publishing
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    defaults:
      run:
        working-directory: dotnet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=$VERSION

      - name: Pack using tag version
        run: |
          dotnet pack HeimdallPower.Api.Client/HeimdallPower.Api.Client/HeimdallPower.Api.Client.csproj --configuration Release --no-build -o out -p:Version=$VERSION
          dotnet pack HeimdallPower.Api.Client/HeimdallPower.Api.Client.Extensions/HeimdallPower.Api.Client.Extensions.csproj --configuration Release --no-build -o out -p:Version=$VERSION

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish the package to nuget.org
        run: |
          for file in out/*.nupkg; do
            echo "Publishing $file"
            dotnet nuget push "$file" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json --skip-duplicate
          done
