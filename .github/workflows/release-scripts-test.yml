name: Release scripts tests

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/nuget-publish.yml'
      - '.github/workflows/python-publish.yml'
      - '.github/workflows/release-scripts-test.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/nuget-publish.yml'
      - '.github/workflows/python-publish.yml'
      - '.github/workflows/release-scripts-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test tag guard
        run: bash .github/scripts/tag-guard.test.sh

      - name: Test prepare-release bump logic
        run: bash .github/scripts/prepare-release.test.sh

      - name: Test prepare-release DRY_RUN smoke behaviour
        run: bash .github/scripts/prepare-release.smoke.test.sh

      - name: Assert publish workflows call the right guard
        run: |
          # If either workflow named the wrong SDK, both publish jobs would
          # skip green on that SDK's tag — nothing published, nothing red.
          grep -q 'tag-guard.sh dotnet' .github/workflows/nuget-publish.yml || {
            echo "::error::nuget-publish.yml no longer calls 'tag-guard.sh dotnet' — the dotnet publish workflow would stop validating its own tags correctly."
            exit 1
          }
          grep -q 'tag-guard.sh python' .github/workflows/python-publish.yml || {
            echo "::error::python-publish.yml no longer calls 'tag-guard.sh python' — the python publish workflow would stop validating its own tags correctly."
            exit 1
          }
