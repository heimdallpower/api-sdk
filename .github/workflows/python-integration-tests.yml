name: Python Integration Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/python-integration-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/python-integration-tests.yml'
  schedule:
    # Weekday run against production to catch API or data drift between changes.
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    # Secrets are not available to fork or Dependabot pull requests; skip instead of failing.
    # Those changes are still covered by the push-to-main and scheduled runs.
    if: >-
      github.repository_owner == 'heimdallpower' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))

    env:
      HEIMDALL_CLIENT_ID: ${{ secrets.HEIMDALL_CLIENT_ID }}
      HEIMDALL_CLIENT_SECRET: ${{ secrets.HEIMDALL_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run integration tests
        run: poetry run pytest -m integration --tb=short
